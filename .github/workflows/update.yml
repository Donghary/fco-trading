name: 시세 갱신

on:
  repository_dispatch:
    types: [refresh]  # 주 수단 : Cloudflare Worker 가 매시 5분, 35분에 요청 (worker/search.js 의 scheduled)
  schedule:
    - cron: "5 * * * *"  # 보조 수단. GitHub 예약은 자주 밀리거나 건너뜀
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 app.py build
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
