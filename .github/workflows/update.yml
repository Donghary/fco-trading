name: 시세 갱신

on:
  repository_dispatch:
    types: [refresh]  # 주 수단 : Cloudflare Worker 가 매시 5분, 35분에 요청 (worker/search.js 의 scheduled)
  schedule:
    - cron: "20 * * * *"  # 보조 수단. GitHub 예약은 자주 밀리거나 건너뜀. Cloudflare(5분, 35분)와 겹치지 않게 20분
  workflow_dispatch:
    inputs:
      fresh:
        description: "이전 기록 없이 처음부터 시작 (state.json 이 정말 없을 때만)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        run: python3 app.py build
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
          FRESH: ${{ inputs.fresh && '1' || '' }}
      # 쌓인 기록의 유일한 사본이 배포본이라 실행마다 백업을 따로 남김 (7일 보관, Actions 실행 화면에서 받을 수 있음)
      - if: steps.build.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: state
          path: site/state.json
          retention-days: 7
      # 넥슨 점검 중이면 build 가 skip=true 를 남김 → 배포하지 않고 이전 페이지 유지
      - if: steps.build.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub 가 방금 올린 파일을 늦게 인식해 배포가 실패하는 일이 있음 (11.20 05:05 실제 발생). 30초 뒤 한 번 더 시도
      - id: deploy
        if: steps.build.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.build.outputs.skip != 'true' && steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.build.outputs.skip != 'true' && steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
