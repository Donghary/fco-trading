name: 시세 갱신

on:
  schedule:
    - cron: "3-59/10 * * * *"  # 매시 3, 13, 23분... (정각은 GitHub 가 붐벼 자주 밀림. 시세는 정각 무렵 바뀜)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 app.py build
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
