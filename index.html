<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101112">
<meta name="color-scheme" content="dark">
<title>구단 시세판</title>
<meta name="description" content="FC온라인 네 구단의 구단 가치와 선수 시세를 한 판에서 봄">
<meta property="og:title" content="구단 시세판">
<meta property="og:description" content="FC온라인 네 구단의 구단 가치와 선수 시세">
<link rel="icon" href="favicon.png?v=4" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png?v=4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root {
  --board: #101112; --panel: #17181A; --raise: #202224; --line: #2A2C2F; --line-strong: #44474C;
  --ink: #F0F1F2; --muted: #9C9FA4; --faint: #85888D;
  --up: #FF5B4F; --down: #4C9DFF; --flat: #C8CACD;
  --amber: #FFC233; --amber-ink: #1B1400;
  --s130: #FF6259; --s140: #C79A1E; --s150: #FFD83A; --s160: #4FE3C1;  /* 능력치 구간 */
  --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --num: "Barlow Condensed", var(--sans);
  --ease: cubic-bezier(.16, 1, .3, 1);
  --dock: 58px;
}
* { box-sizing: border-box; }
html { background: var(--board); color-scheme: dark; scrollbar-color: var(--line-strong) var(--board); -webkit-text-size-adjust: 100%; }
body { margin: 0; color: var(--ink); font: 15px/1.5 var(--sans); word-break: keep-all; overflow-wrap: anywhere;
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: contain; }
::selection { background: var(--amber); color: var(--amber-ink); }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 4px; }
h1, h2, p, ol, ul, dl, dd { margin: 0; padding: 0; }
ol, ul { list-style: none; }
img { display: block; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
svg.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* 숫자 : 좁은 고정폭 숫자, 단위(조 억 만)는 작게 */
.num { font-family: var(--num); font-variant-numeric: tabular-nums lining-nums; font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.num i { font: 600 .64em/1 var(--sans); font-style: normal; opacity: .72; margin: 0 .12em 0 .06em; }
.na { color: var(--faint); font-family: var(--sans); font-weight: 500; font-size: 13px; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--flat); }
.chg { display: inline-flex; align-items: baseline; gap: 3px; }
.chg svg { width: .62em; height: .62em; fill: currentColor; align-self: center; flex: none; }
.chg.down svg { transform: rotate(180deg); }
.roll { animation: roll .42s var(--ease); }
@keyframes roll { from { transform: translateY(55%); opacity: 0; filter: blur(3px); } }

/* 틀 */
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; height: 52px;
  padding: 0 max(16px, env(safe-area-inset-left)); background: var(--board); border-bottom: 1px solid var(--line); }
.brand { font-weight: 800; font-size: 17px; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
.brand img { width: 26px; height: 26px; }
#stamp { margin-left: auto; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
#stamp::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
#stamp.late { color: var(--amber); } #stamp.late::before { background: var(--amber); }
.dock { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(3, 1fr);
  height: calc(var(--dock) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  background: var(--panel); border-top: 1px solid var(--line); }
.dock a { display: grid; place-items: center; align-content: center; gap: 2px; color: var(--muted); font-size: 11px; font-weight: 600; }
.dock a[aria-current] { color: var(--amber); }
main { max-width: 760px; margin: 0 auto; padding: 0 16px calc(var(--dock) + env(safe-area-inset-bottom) + 28px); }
.foot { color: var(--faint); font-size: 12px; padding: 28px 0 0; }

.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding-top: 10px; }
.bar h1, .bar h2 { font-size: 13px; font-weight: 600; color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 14px;
  border-radius: 8px; border: 1px solid var(--line-strong); background: transparent; font-size: 14px; font-weight: 600;
  transition: background .16s, border-color .16s, color .16s; }
.btn:hover { background: var(--raise); }
.btn:active { background: var(--line); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.go { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); }
.btn.go:hover { background: #FFD061; }
.btn.quiet { border-color: transparent; color: var(--muted); padding: 0 8px; }
.btn.quiet[aria-pressed=true] { color: var(--amber); }

/* 홈 : 시세판 */
.board { border-top: 1px solid var(--line-strong); }
.q { position: relative; border-bottom: 1px solid var(--line); }
.q-main { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 14px 0 12px; transition: background .16s; }
.q-main:hover { background: var(--panel); }
.q-name { font-size: 17px; font-weight: 700; letter-spacing: -.02em; align-self: end; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q-val { font-size: 32px; line-height: 1.05; text-align: right; }
.q-sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q-chg { display: grid; grid-template-columns: auto auto auto; justify-content: end; align-items: baseline; gap: 1px 10px; font-size: 16px; }
.q-chg .lbl { color: var(--muted); font: 500 12px var(--sans); }
.q-chg .chg, .q-chg .amt { justify-self: end; }
.q-chg .amt { font-weight: 500; min-width: 64px; text-align: right; }
.q-line { grid-column: 1 / -1; width: 100%; height: 34px; margin-top: 8px; }
.q-line path { fill: none; stroke: var(--muted); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.q-err { grid-column: 1 / -1; color: var(--amber); font-size: 13px; }
.editing .q-main { padding-right: 100px; pointer-events: none; min-height: 72px; align-content: center; }
.editing .q-val, .editing .q-chg, .editing .q-line { display: none; }
.q-move { position: absolute; right: 0; top: 50%; transform: translateY(-50%); display: flex; gap: 6px; }
.q-move .btn { width: 44px; padding: 0; }
.q-more { display: flex; align-items: center; justify-content: space-between; min-height: 56px; border-bottom: 1px solid var(--line); font-weight: 700; }
.q-more span:last-child { color: var(--muted); font-weight: 500; font-size: 13px; display: flex; align-items: center; gap: 4px; }

/* 상세 머리 */
.head { display: flex; align-items: center; gap: 4px; min-height: 52px; margin-left: -10px; }
.head .btn { width: 44px; padding: 0; border-color: transparent; }
.head h1 { font-size: 20px; font-weight: 800; letter-spacing: -.02em; display: flex; align-items: center; gap: 7px; min-width: 0; }
.head h1 b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.quote { padding: 4px 0 6px; }
.quote .big { font-size: 40px; line-height: 1.05; }
.quote .big small { font: 600 14px var(--sans); color: var(--muted); margin-left: 6px; }
.ago { display: grid; grid-template-columns: auto auto auto 1fr; gap: 2px 12px; margin-top: 10px; font-size: 16px; align-items: baseline; }
.ago .lbl { color: var(--muted); font-size: 13px; white-space: nowrap; }
.ago .then { color: var(--flat); }

/* 차트 */
.chart { margin-top: 18px; }
.ranges { display: flex; gap: 4px; }
.ranges button { flex: 1; min-height: 40px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; transition: background .16s, color .16s; }
.ranges button:hover { color: var(--ink); }
.ranges button[aria-selected=true] { background: var(--raise); color: var(--amber); }
.plot { position: relative; margin-top: 8px; touch-action: pan-y; cursor: crosshair; border-radius: 4px; }
.plot > svg { display: block; width: 100%; height: 210px; overflow: visible; }
.plot .grid { stroke: var(--line); stroke-width: 1; }
.plot .series { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.plot text { font: 600 12px var(--num); fill: var(--muted); }
.plot .cross { stroke: var(--line-strong); stroke-width: 1; }
.plot .base { stroke: var(--faint); stroke-width: 1; stroke-dasharray: 2 5; }
.plot [hidden] { display: none; }
.readout { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 12px; height: 54px; align-content: center; margin-top: 8px; font-size: 14px; }
.readout b { font-size: 24px; line-height: 1.15; }
.readout .when { color: var(--muted); font: 600 15px var(--num); min-width: 78px; }
.readout .vs { flex-basis: 100%; color: var(--muted); }
.readout .vs.rest { font-size: 16px; }
.plot-empty { display: grid; place-items: center; height: 210px; color: var(--muted); font-size: 14px; text-align: center; padding: 0 24px; }
.plot-foot { display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: space-between; color: var(--muted); font-size: 13px; margin-top: 6px; }
.plot-foot .mm { color: var(--flat); font-size: 15px; }

/* 선수 목록 */
.sorts { display: flex; align-items: center; gap: 2px; margin-right: -8px; }
.rows { border-top: 1px solid var(--line-strong); }
.rows > li { border-bottom: 1px solid var(--line); }
.rows > li.acts { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 4px; }
.rows > li.acts > .btn { margin-top: 8px; }
.p { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; grid-template-areas: "face id now" "face d1 d1" "face d7 d7";
  gap: 3px 10px; padding: 12px 0; transition: background .16s; }
a.p:hover { background: var(--panel); }
.face { grid-area: face; width: 48px; height: 48px; object-fit: contain; object-position: bottom; background: var(--panel); border-radius: 8px; }
.p-id { grid-area: id; display: flex; align-items: center; gap: 6px; min-width: 0; }
.p-id b { font-weight: 700; font-size: 16px; letter-spacing: -.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.season { height: 18px; width: auto; flex: none; }
.pos { color: var(--muted); font: 600 13px var(--num); flex: none; }
.ovr-n { color: var(--flat); font-size: 16px; flex: none; }
.p-now { grid-area: now; font-size: 22px; line-height: 1.2; text-align: right; }
.p-d { display: grid; grid-template-columns: 44px 1fr 68px 84px; align-items: baseline; font-size: 15px; }
.p-d.d1 { grid-area: d1; } .p-d.d7 { grid-area: d7; }
.p-d .lbl { color: var(--muted); font-size: 12px; }
.p-d .then { color: var(--flat); font-weight: 500; }
.p-d .chg, .p-d .amt { justify-self: end; }
.p-d .amt { font-weight: 500; }
.p-act { grid-area: now; align-self: center; }
.pending { color: var(--muted); font-size: 13px; grid-area: d1; }

/* 강화 배지 : 게임의 색 단계 (1 회색, 2~4 동, 5~7 은, 8~10 금, 11~13 플래티넘) */
.g { display: inline-grid; place-items: center; min-width: 22px; height: 20px; padding: 0 4px; border-radius: 4px; border: 1.5px solid;
  font: 700 14px/1 var(--num); flex: none; }
.g1 { color: #c5c8c9; background: linear-gradient(140deg, #51545a, #42464d); border-color: #62676d #393a3c #393a3c #62676d; }
.g2 { color: #5a2814; background: linear-gradient(140deg, #de946b, #ad5f42); border-color: #e4b7a2 #864229 #864229 #e4b7a2; }
.g5 { color: #4e545e; background: linear-gradient(140deg, #d8d9dc, #b8bdca); border-color: #d8dadc #a9aaae #a5a8ae #d8dadc; }
.g8 { color: #695100; background: linear-gradient(140deg, #f9dd62, #dca908); border-color: #e9d36c #cda000 #cda000 #e9d36c; }
.g11 { color: #2d2b43; background: linear-gradient(140deg, #eef1fd, #a9b9ee 42%, #f3ebfc 68%, #9db0ea); border-color: #bdc5e5 #5274c0 #5274c0 #607dc4; }

/* 선수 상세 */
.who { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 12px; align-items: center; }
.who .face { width: 96px; height: 96px; grid-area: auto; }
.ovr { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; color: var(--muted); font-size: 13px; }
.ovr .num { color: var(--ink); font-size: 17px; margin-left: 4px; }
section { margin-top: 30px; }
section > h2 { font-size: 13px; font-weight: 600; color: var(--muted); padding-bottom: 8px; border-bottom: 1px solid var(--line-strong); }
.traits { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 14px; }
.traits li { padding: 4px 9px; border: 1px solid var(--line-strong); border-radius: 6px; font-size: 13px; font-weight: 600; }
.traits li:first-child { border: 0; padding-left: 0; color: var(--muted); font-weight: 500; }
.sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 16px; }
.stats { columns: 2; column-gap: 20px; }
.st { --bar: var(--line-strong); display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 8px 0 7px; break-inside: avoid;
  background: linear-gradient(var(--bar), var(--bar)) left bottom / var(--w) 2px no-repeat, linear-gradient(var(--line), var(--line)) left bottom / 100% 1px no-repeat; }
.st span { color: var(--muted); font-size: 13px; }
.st .num { font-size: 18px; color: var(--flat); }
.s130 { --bar: var(--s130); } .s140 { --bar: var(--s140); } .s150 { --bar: var(--s150); } .s160 { --bar: var(--s160); }
.st[class*=" s1"] .num { color: var(--bar); font-weight: 700; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
.facts div { display: flex; justify-content: space-between; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.facts dt { color: var(--muted); font-size: 13px; }
.facts dd { font-weight: 600; text-align: right; }
.watchbtn { margin-top: 22px; width: 100%; }

/* 관심선수, 검색 */
.find { display: flex; gap: 8px; }
.field { flex: 1; min-width: 0; min-height: 46px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--panel);
  font-size: 16px; caret-color: var(--amber); transition: border-color .16s; }
.field::placeholder { color: var(--faint); }
.field:focus { outline: none; border-color: var(--amber); }
select.field { flex: none; width: 76px; padding: 0 8px; font-family: var(--num); font-weight: 600; font-size: 17px; }
label.lab { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 22px 0 6px; }
label.lab.first { margin-top: 0; }
.field.wide { width: 100%; font: 700 16px var(--sans); padding: 0 14px; }
.rows.listed { margin-top: 14px; }
.note { color: var(--muted); font-size: 14px; padding: 16px 0; max-width: 62ch; }
.note b { color: var(--ink); }
.msg { color: var(--ink); font-size: 14px; font-weight: 600; padding: 10px 0 0; }
.res { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 8px 0; }
.res .p-id { grid-area: auto; }
.res .p-id small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
details { margin-top: 26px; border-top: 1px solid var(--line-strong); }
summary { min-height: 48px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-weight: 600; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary span { color: var(--muted); font-weight: 500; font-size: 13px; }
details ol { counter-reset: s; color: var(--muted); font-size: 14px; padding-bottom: 6px; }
details ol li { counter-increment: s; padding: 3px 0 3px 22px; position: relative; }
details ol li::before { content: counter(s); position: absolute; left: 0; color: var(--faint); font: 600 14px var(--num); }
.skel { height: 74px; border-bottom: 1px solid var(--line); background: linear-gradient(var(--panel), var(--panel)) 0 16px / 42% 16px no-repeat, linear-gradient(var(--panel), var(--panel)) 100% 16px / 26% 26px no-repeat; }

/* 경기 결과 칸 : 빨강, 파랑은 시세 등락 전용이라 승패는 명암으로만 구분 */
.rc { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; font: 700 12px/1 var(--sans); flex: none; }
.rc.w { background: var(--ink); color: var(--board); }
.rc.d { background: var(--raise); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
.rc.l { color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-strong); }
.form { display: inline-flex; gap: 3px; vertical-align: middle; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; color: var(--amber); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; margin-left: 6px; line-height: 16px; }

/* 오늘의 등락 */
.movers { margin-top: 26px; }
.movers h2 { font-size: 13px; font-weight: 600; color: var(--muted); padding: 0 0 8px; border-bottom: 1px solid var(--line-strong); }
.mv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); transition: background .16s; }
.mv:hover { background: var(--panel); }
.mv small { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mv-r { grid-column: 2; grid-row: 1 / span 2; display: grid; justify-items: end; gap: 1px; }
.mv-r .num:first-child { font-size: 17px; }
.mv-r .chg, .mv-r .amt { font-size: 14px; }
.mv .p-id { grid-area: auto; grid-column: 1; }
.mv small { grid-column: 1; }

/* 최근 공식경기 */
.of { display: grid; grid-template-columns: 22px 62px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.of .sc { font-size: 18px; }
.of .op { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.of time, .mt time { color: var(--muted); font: 600 13px var(--num); white-space: nowrap; }
.ofform { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 10px; color: var(--muted); font-size: 13px; }

/* 상대전적 */
.lg { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto 64px; gap: 2px 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.lg .rk { color: var(--faint); font: 600 15px var(--num); }
.lg b { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lg small { grid-column: 2; color: var(--muted); font-size: 12px; }
.lg .rec { grid-column: 3; grid-row: 1 / span 2; font-size: 17px; }
.lg .pct { grid-column: 4; grid-row: 1 / span 2; font-size: 26px; text-align: right; }
.lg .pct i, .duel .big i { font-size: .5em; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 6px 10px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); transition: background .16s; }
.pair:hover { background: var(--panel); }
.pair .pa, .pair .pb { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pair .pb { text-align: right; }
.pair .ps { font-size: 22px; text-align: center; line-height: 1.15; }
.pair .ps small { display: block; font: 600 12px var(--num); color: var(--muted); letter-spacing: .02em; }
.pbar { grid-column: 1 / -1; display: flex; gap: 2px; height: 5px; }
.pbar b { border-radius: 3px; background: var(--ink); }
.pbar b:nth-child(2) { background: var(--line-strong); }
.pbar b:nth-child(3) { background: var(--muted); opacity: .5; }
.pm { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.duel .big { font-size: 38px; line-height: 1.1; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 16px; margin-top: 12px; }
.kv div { padding: 8px 0; border-bottom: 1px solid var(--line); }
.kv dt { color: var(--muted); font-size: 12px; }
.kv dd { font-size: 17px; }

  <div id="app"><div class="bar"><h1>불러오는 중</h1></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  <p class="foot">Data based on NEXON Open API</p>

<script>
const CDN = 'https://fco.dn.nexoncdn.co.kr/live/externalAssets/common/';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const LS = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let S = null, NAMES = null, namesLoading = false, namesFailed = false;
const detail = {};  // 선수 상세 캐시 : key → {at, data | error}
const STALE = 65 * 60;  // 시세는 1시간마다 갱신됨. 이보다 오래되면 늦은 것
const ui = { edit: false, sort: 'now', range: {}, q: '', msg: '', busy: false };

// ---------- 숫자 표기 ----------
const UNITS = [[1e12, '조'], [1e8, '억'], [1e4, '만']];
function full(n) {  // 355억 3,600만
  if (n == null) return '<span class="na">준비 중</span>';
  if (!n) return '<span class="na">시세 없음</span>';
  let out = [], r = Math.abs(n);
  for (const [u, s] of UNITS) { const v = Math.floor(r / u); if (v) { out.push(v.toLocaleString('ko-KR') + `<i>${s}</i>`); r %= u; } }
  if (r && Math.abs(n) < 1e7) out.push(r.toLocaleString('ko-KR'));
  return out.slice(0, 2).join(' ');
}
function compact(n) {  // 18.5억
  if (n == null) return '<span class="na">준비 중</span>';
  if (!n) return '<span class="na">없음</span>';
  const a = Math.abs(n);
  for (const [u, s] of UNITS) if (a >= u) {
    const v = a / u, d = v >= 100 ? 0 : v >= 10 ? 1 : 2;
    return (+v.toFixed(d)).toLocaleString('ko-KR') + `<i>${s}</i>`;
  }
  return a.toLocaleString('ko-KR');
}
// 등락 : 퍼센트와 금액. 색에만 기대지 않도록 세모와 부호를 함께 씀
function move(now, base, fmt = compact) {
  if (!now || !base) return ['<span class="chg num flat">-</span>', ''];
  const diff = now - base, pct = diff / base * 100;
  const dir = pct > 0.049 ? 'up' : pct < -0.049 ? 'down' : 'flat';
  const word = { up: '상승', down: '하락', flat: '변동 없음' }[dir];
  const mark = dir === 'flat' ? '' : '<svg><use href="#i-tri"/></svg>';
  const p = Math.abs(pct);
  return [`<span class="chg num ${dir}"><span class="sr">${word}</span>${mark}${p >= 100 ? p.toFixed(0) : p.toFixed(1)}%</span>`,
          `<span class="amt num ${dir}">${diff > 0 ? '+' : diff < 0 ? '−' : ''}${diff ? fmt(diff) : '0'}</span>`];
}
const ago = (p, days) => p.hist.at(-days) ?? p.hist[0] ?? p.now;  // hist 의 마지막 값이 어제
const key = p => `${p.spid}_${p.grade}`;
const two = n => String(n).padStart(2, '0');
const clock = t => { const d = new Date(t * 1000); return `${d.getMonth() + 1}.${two(d.getDate())} ${two(d.getHours())}:${two(d.getMinutes())}`; };
const gradeBadge = g => `<span class="g g${g >= 11 ? 11 : g >= 8 ? 8 : g >= 5 ? 5 : g >= 2 ? 2 : 1}"><span class="sr">강화 </span>${g}</span>`;
const face = p => `<img class="face" src="${CDN}playersAction/p${p.spid}.png" data-pid="${p.spid % 1000000}" alt="" width="48" height="48" loading="lazy">`;
const ident = p => `${gradeBadge(p.grade)}${p.seasonImg ? `<img class="season" src="${esc(p.seasonImg)}" alt="${esc(p.season)}" height="18">` : ''}<b>${esc(p.name)}</b>`;

// ---------- 풀케미 오버롤 ----------
// 받아온 능력치는 적응도 5 가 이미 반영된 값이고, 풀케미는 그 위에 따로 더함 (사용자 기준)
// 선발 중 8강 이상이 8명이면 8강 이상 선수 +8, 선발 중 11강 이상이 8명이면 11강 이상 선수만 +9 (그 팀의 8~10강은 +8)
function chem(players, grade) {
  const st = players.filter(p => p.pos !== 'SUB'), n = g => st.filter(p => p.grade >= g).length;
  return grade >= 11 && n(11) >= 8 ? 9 : grade >= 8 && n(8) >= 8 ? 8 : 0;
}
const chemSolo = grade => grade >= 11 ? 9 : grade >= 8 ? 8 : 0;
const tier = v => v >= 160 ? 's160' : v >= 150 ? 's150' : v >= 140 ? 's140' : v >= 130 ? 's130' : '';
const chemLabel = c => c ? `적응도 5 + 풀케미 +${c}` : '적응도 5';

// ---------- 구단 합계 ----------
function team(players) {
  const ps = players.filter(p => p.now);
  const sum = f => ps.reduce((a, p) => a + f(p), 0);
  const days = ps.length ? Math.min(30, Math.max(...ps.map(p => p.hist.length))) : 0;
  return { n: ps.length, now: sum(p => p.now), d1: sum(p => ago(p, 1)), d7: sum(p => ago(p, 7)),
           hist: [...Array(days).keys()].map(i => sum(p => ago(p, days - i))) };
}
const day0 = () => { const d = new Date(S.updated * 1000); d.setHours(0, 0, 0, 0); return d / 1000; };
function dailyPts(values, labels) {  // 일별 값에 시각을 붙이고 현재가를 끝에 더함
  const n = values.length, base = day0();
  return values.map((v, i) => ({ t: base - (n - i) * 86400 + 43200, v, lab: labels ? labels[i] : clock(base - (n - i) * 86400).split(' ')[0] }));
}
const orderOf = () => { const o = LS.get('order', []); return S.owners.map((x, i) => ({ ...x, i })).sort((a, b) => (o.indexOf(a.nick) + 1 || 99) - (o.indexOf(b.nick) + 1 || 99)); };

// ---------- 차트 ----------
function chartHTML(id, ranges) {
  const cur = ranges.some(r => r.id === ui.range[id]) ? ui.range[id] : ranges.find(r => r.best)?.id ?? ranges[0].id;
  ui.range[id] = cur;
  return `<div class="chart" data-chart="${id}">
    <div class="ranges" role="tablist" aria-label="기간">${ranges.map(r => `<button role="tab" aria-selected="${r.id === cur}" data-range="${r.id}">${r.label}</button>`).join('')}</div>
    <div class="readout"></div><div class="plot" tabindex="0" role="img"></div><div class="plot-foot"></div></div>`;
}
const charts = {};
function drawChart(id, ranges) {
  const host = document.querySelector(`[data-chart="${id}"]`);
  if (!host) return;
  charts[id] = ranges;
  const r = ranges.find(x => x.id === ui.range[id]), pts = r.pts, plot = host.querySelector('.plot'), foot = host.querySelector('.plot-foot');
  if (pts.length < 2) {
    plot.innerHTML = `<div class="plot-empty">${esc(r.note || '이 기간에는 표시할 시세 기록이 아직 없음')}</div>`;
    plot.setAttribute('aria-label', '기록 없음'); foot.innerHTML = ''; host.querySelector('.readout').innerHTML = ''; plot._pts = null;
    return;
  }
  const W = plot.clientWidth || 340, H = W >= 600 ? 260 : 210, L = 4, R = 54, T = 14, B = 24;
  const t0 = pts[0].t, t1 = pts.at(-1).t, vs = pts.map(p => p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  const min = lo, max = hi, pad = (hi - lo || hi * .02) * .12; lo -= pad; hi += pad;
  const X = t => L + (t - t0) / (t1 - t0 || 1) * (W - L - R), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const dir = vs.at(-1) > vs[0] ? 'up' : vs.at(-1) < vs[0] ? 'down' : 'flat';
  const d = pts.map((p, i) => i ? (r.step ? `H${X(p.t).toFixed(1)}V${Y(p.v).toFixed(1)}` : `L${X(p.t).toFixed(1)} ${Y(p.v).toFixed(1)}`) : `M${X(p.t).toFixed(1)} ${Y(p.v).toFixed(1)}`).join('');
  const ticks = max === min ? [max] : [max, (max + min) / 2, min];
  plot.innerHTML = `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${W - R + 8}" y="${Y(v) + 4}">${compact(v).replace(/<[^>]+>/g, '')}</text>`).join('')}
    <path d="${d}L${X(t1)} ${H - B}L${X(t0)} ${H - B}Z" fill="var(--${dir})" opacity=".1"/>
    <line class="base" x1="${L}" x2="${W - R}" y1="${Y(vs[0])}" y2="${Y(vs[0])}"/>
    <path class="series" d="${d}" stroke="var(--${dir})"/>
    <text x="${L}" y="${H - 6}">${esc(pts[0].lab)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${esc(pts.at(-1).lab)}</text>
    <g class="hover" hidden><line class="cross" y1="${T}" y2="${H - B}"/><circle r="4.5" fill="var(--board)" stroke="var(--${dir})" stroke-width="2.5"/></g>
  </svg>`;
  plot.setAttribute('aria-label', `${r.label} 시세 추이. 최저 ${compact(min).replace(/<[^>]+>/g, '')}, 최고 ${compact(max).replace(/<[^>]+>/g, '')}`);
  foot.innerHTML = `<span>최저 <span class="num mm">${compact(min)}</span></span><span>최고 <span class="num mm">${compact(max)}</span></span>${r.note ? `<span>${esc(r.note)}</span>` : ''}`;
  plot._pts = pts; plot._geo = { X, Y, W, L, R };
  hoverChart(plot, null);
}
function hoverChart(plot, i) {
  // i 가 없으면 기간의 마지막 값을 읽어 주고 십자선은 숨김
  const pts = plot._pts, g = plot.querySelector('.hover'), out = plot.previousElementSibling;
  if (!pts || !g) return;
  const show = i != null;
  plot._i = i = Math.max(0, Math.min(pts.length - 1, i ?? pts.length - 1));
  const p = pts[i], { X, Y } = plot._geo, x = X(p.t), [pc, amt] = move(p.v, pts[0].v);
  g.toggleAttribute('hidden', !show);
  g.querySelector('line').setAttribute('x1', x); g.querySelector('line').setAttribute('x2', x);
  g.querySelector('circle').setAttribute('cx', x); g.querySelector('circle').setAttribute('cy', Y(p.v));
  const vs = i ? `${esc(pts[0].lab)}보다 ${pc} ${amt}` : '이 기간의 시작 값';
  out.innerHTML = show ? `<span class="when">${esc(p.lab)}</span><b class="num">${full(p.v)}</b><span class="vs">${vs}</span>` : `<span class="vs rest">${vs}</span>`;
}
function nearest(plot, clientX) {
  const { X } = plot._geo, x = clientX - plot.getBoundingClientRect().left, pts = plot._pts;
  let best = 0;
  pts.forEach((p, i) => { if (Math.abs(X(p.t) - x) < Math.abs(X(pts[best].t) - x)) best = i; });
  return best;
}

// ---------- 화면 ----------
const bigPrice = now => `<div class="big num" data-roll="big">${full(now)}${now ? '<small>BP</small>' : ''}</div>`;
function agoBlock(now, d1, d7) {
  const [p1, a1] = move(now, d1, full), [p7, a7] = move(now, d7, full);
  return `<div class="ago"><span class="lbl">1일 전</span><span class="then num">${d1 ? full(d1) : '-'}</span>${p1}${a1}
    <span class="lbl">7일 전</span><span class="then num">${d7 ? full(d7) : '-'}</span>${p7}${a7}</div>`;
}
function playerRow(p, extra = '', add = chemSolo(p.grade), ctx = '') {
  const cell = (days, cls) => { const then = ago(p, days), [pc, amt] = move(p.now, p.hist.length ? then : 0);
    return `<span class="p-d ${cls}"><span class="lbl">${days}일 전</span><span class="then num">${p.hist.length ? compact(then) : '-'}</span>${pc}${amt}</span>`; };
  return `<li><a class="p" href="#/p/${p.spid}/${p.grade}${ctx}">${face(p)}
    <span class="p-id">${ident(p)}${rating(p, add)}</span>
    <span class="p-now num" data-roll="${key(p)}">${compact(p.now)}</span>
    ${p.pending ? '<span class="pending">방금 저장함. 시세는 1~2분 뒤에 표시됨</span>' : cell(1, 'd1') + cell(7, 'd7')}</a>${extra}</li>`.replace('<li>', extra ? '<li class="acts">' : '<li>');
}
const SLOT = { LCB: 'CB', RCB: 'CB', LCM: 'CM', RCM: 'CM', LDM: 'CDM', RDM: 'CDM', LAM: 'CAM', RAM: 'CAM', LS: 'ST', RS: 'ST', LF: 'CF', RF: 'CF' };
function rating(p, add) {
  const ps = p.positions || [], hit = ps.find(x => x[0] === (SLOT[p.pos] || p.pos)), [pos, v] = hit || ps[0] || [];
  if (!v) return p.pos ? `<span class="pos">${esc(p.pos)}</span>` : '';
  return `<span class="pos">${esc(hit ? p.pos : pos)}</span><span class="ovr-n num"><span class="sr">오버롤 </span>${v + add}</span>${p.pos === 'SUB' ? '<span class="pos">SUB</span>' : ''}`;
}
const SORTS = { now: ['현재가', p => p.now || 0], d1: ['1일 등락', p => p.now && p.hist.length ? p.now / ago(p, 1) : -1], d7: ['7일 등락', p => p.now && p.hist.length ? p.now / ago(p, 7) : -1] };
function playerList(players, team, ctx) {
  const f = SORTS[ui.sort][1];
  return `<div class="bar"><h2>선수 ${players.length}명</h2><div class="sorts" role="group" aria-label="정렬">${Object.entries(SORTS).map(([k, [label]]) =>
      `<button class="btn quiet" data-sort="${k}" aria-pressed="${k === ui.sort}">${label}순</button>`).join('')}</div></div>
    <ol class="rows">${[...players].sort((a, b) => f(b) - f(a)).map(p => playerRow(p, '', team ? chem(team, p.grade) : chemSolo(p.grade), ctx)).join('')}</ol>`;
}

function viewHome() {
  const teams = S.owners.map(o => team(o.players)), rel = t => [...t.hist, t.now].map((v, _, h) => v / h[0]);
  const span = Math.max(.01, ...teams.filter(t => t.n).map(t => Math.max(...rel(t)) - Math.min(...rel(t))));  // 가장 크게 움직인 구단의 폭을 공통 눈금으로
  const rows = orderOf().map((o, at, all) => {
    const t = teams[o.i], [p1, a1] = move(t.now, t.d1), [p7, a7] = move(t.now, t.d7);

function playerRanges(d) {
  const now = S.updated, cur = d.now ? [{ t: now, v: d.now, lab: '현재' }] : [];
  const intra = d.intra.map(([t, v]) => ({ t, v, lab: clock(t) }));
  const since = intra.length ? `시간대별 기록은 ${clock(intra[0].t)}부터 쌓는 중` : '시간대별 기록을 쌓기 시작함';
  const win = (hours) => {  // 창 시작 시점의 값을 이어 붙여 선이 창 왼쪽 끝에서 시작하게 함
    const start = now - hours * 3600, inside = intra.filter(p => p.t >= start), before = intra.filter(p => p.t < start).at(-1);
    const pts = [...(before ? [{ t: start, v: before.v, lab: clock(start) }] : []), ...inside, ...cur];
    return { pts, step: true, note: before ? '' : since };
  };
  const daily = dailyPts(d.daily, d.days), covers7 = intra.length && intra[0].t <= now - 6 * 86400, span = intra.length ? now - intra[0].t : 0;
  return [
    { id: '3h', label: '3시간', ...win(3) },
    { id: '24h', label: '24시간', ...win(24), best: span >= 3 * 3600 },
    covers7 ? { id: '7d', label: '7일', ...win(168) } : { id: '7d', label: '7일', pts: [...daily.slice(-7), ...cur] },
    { id: '30d', label: '30일', pts: [...daily.slice(-30), ...cur], best: span < 3 * 3600 },
    { id: 'all', label: daily.length >= 360 ? '1년' : '전체', pts: [...daily, ...cur] },
  ];
}

// ---------- 관심선수 : 구단주별 목록. 저장소의 watchlist.json 을 고침 (편집 권한 필요) ----------
const who = () => { const w = LS.get('who', ''); return S.owners.some(o => o.nick === w) ? w : S.owners[0].nick; };
function watchAll() {  // {구단주명: [선수]}. 방금 저장한 내용은 다음 갱신 전까지 이 기기에서 먼저 보여 줌
  const o = LS.get('watchOverride', null), now = Date.now() / 1000;
  if (!o || !o.lists || now - o.at > 900) return S.watch;
  const have = Object.fromEntries(Object.values(S.watch).flat().map(w => [key(w), w]));
  const same = S.owners.every(({ nick }) => { const a = o.lists[nick] || [], b = S.watch[nick] || []; return a.length === b.length && a.every((w, i) => key(w) === key(b[i])); });
  if (same) { LS.set('watchOverride', null); return S.watch; }
  return Object.fromEntries(S.owners.map(({ nick }) => [nick, (o.lists[nick] || []).map(w => have[key(w)] || { ...w, pos: '', now: null, hist: [], pending: true })]));
}
const watchOf = nick => watchAll()[nick] || [];
async function repoWrite(path, change, message) {
  const url = `https://api.github.com/repos/${S.repo}/contents/${path}`, headers = { Authorization: 'Bearer ' + LS.get('token', ''), Accept: 'application/vnd.github+json' };
  const cur = await fetch(url, { headers, cache: 'no-store' });
  if (cur.status === 401) throw new Error('편집 권한이 만료되었거나 맞지 않음. 비밀번호나 토큰을 다시 넣어야 함');
  if (!cur.ok && cur.status !== 404) throw new Error('이 권한으로는 저장소에 접근할 수 없음');
  const file = cur.ok ? await cur.json() : null;
  const next = change(file ? JSON.parse(new TextDecoder().decode(unb64(file.content.replace(/\s/g, '')))) : null);  // 한글 구단주명이 들어가므로 UTF-8 로 다룸
  const put = await fetch(url, { method: 'PUT', headers, body: JSON.stringify({ message, content: b64(new TextEncoder().encode(JSON.stringify(next))), ...(file && { sha: file.sha }) }) });
  if (!put.ok) throw new Error(put.status === 409 ? '다른 변경과 겹침. 다시 눌러 주면 됨' : '저장하지 못함. 토큰에 Contents 쓰기 권한이 있는지 확인해야 함');
  return next;
}

    LS.set('watchOverride', { at: Date.now() / 1000, lists: Object.fromEntries(Object.entries(lists).map(([n, l]) => [n, l.map(w => { const c = known[key(w)] || w;
      return { spid: w.spid, grade: w.grade, name: c.name || String(w.spid), season: c.season || '', seasonImg: c.seasonImg || '', positions: c.positions || [] }; })])) });

// 편집 권한 : 저장소 주인이 토큰을 비밀번호로 잠가 lock.json 에 올려 두면, 친구들은 비밀번호만으로 토큰을 풀어 씀
const b64 = a => btoa(String.fromCharCode(...new Uint8Array(a))), unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function passKey(pass, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function lockToken(pass, token) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  return { salt: b64(salt), iv: b64(iv), data: b64(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await passKey(pass, salt), new TextEncoder().encode(token))) };
}
async function unlockToken(pass, lock) {
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(lock.iv) }, await passKey(pass, unb64(lock.salt)), unb64(lock.data)));
}
async function unlock(pass) {
  ui.busy = true; render();
  try { LS.set('token', await unlockToken(pass, await (await fetch('lock.json?t=' + Date.now())).json())); ui.msg = '이 기기에서 저장할 수 있게 됨'; ui.needToken = false; }
  catch { ui.msg = '비밀번호가 맞지 않음'; ui.needToken = true; }
  ui.busy = false; render();
}
async function setLock(pass) {
  if (pass.length < 4) { ui.msg = '비밀번호는 4자 이상이어야 함'; ui.needToken = true; return render(); }
  ui.busy = true; render();
  try { const lock = await lockToken(pass, LS.get('token', '')); await repoWrite('lock.json', () => lock, '편집 비밀번호 변경'); ui.msg = '비밀번호를 정함. 1~2분 뒤부터 친구들이 이 비밀번호로 저장할 수 있음'; }
  catch (e) { ui.msg = e.message === 'Failed to fetch' ? '인터넷 연결을 확인해야 함' : e.message; }
  ui.busy = false; ui.needToken = true; render();
}

function search(q) {
  q = q.replace(/\s/g, '').toLowerCase();
  if (!q || !NAMES) return [];
  const out = [];
  for (const [pid, [name, seasons]] of Object.entries(NAMES.players)) {
    const n = name.replace(/\s/g, '').toLowerCase();
    if (!n.includes(q)) continue;
    for (const s of seasons) out.push({ spid: s * 1000000 + +pid, name, season: NAMES.seasons[s]?.[0] || '', seasonImg: NAMES.seasons[s]?.[1] || '', exact: n === q });
  }
  return out.sort((a, b) => b.exact - a.exact || b.spid - a.spid).slice(0, 80);
}

const files = {};

  const f = files[name];
  if ((!f || f.at !== S.updated) && !f?.busy) {
    files[name] = { ...f, busy: true };
    fetch(`${name}?t=${S.updated}`).then(r => r.ok ? r.json() : Promise.reject())

const chip = r => `<span class="rc ${r === '승' ? 'w' : r === '패' ? 'l' : 'd'}" title="${esc(r)}">${esc(r || '-')}</span>`;

const tally = rs => rs.reduce((a, r) => (a[r === '승' ? 0 : r === '패' ? 2 : 1]++, a), [0, 0, 0]);
const wdl = ([w, d, l]) => `${w}<i>승</i> ${d}<i>무</i> ${l}<i>패</i>`;
// 슈팅 종류 : 넥슨이 슛마다 기록하는 종류 번호. 1, 2, 3, 6, 7, 8, 9 는 fcgg 집계(456화이팅 최근 25경기)와 숫자가 모두 일치해 확인함.

  rows.forEach(r => r.mg.forEach(g => { const n = g.n || '알 수 없음'; sc[n] = (sc[n] || 0) + 1; }));
  const first = rows.at(-1), show = ui.more ? rows : rows.slice(0, 20);
  return head + `<div class="quote duel"><div class="big num">${wdl(t)}</div>
      <div class="ofform"><span>${esc(mine.labels?.[s] || O.labels?.[s] || s)}${isCur || s === '전체' || String(mine.labels?.[s] || O.labels?.[s]).includes('리그') ? '' : ' (지난 시즌)'}, ${t[0] + t[1] + t[2]}경기, 승률 ${pct(t)}%${sum?.base ? `, 게임 안 기록(${mdate(sum.base.asof)}까지) 포함` : `, 받은 기록 ${mdate(first.d).split(' ')[0]}부터`}</span>${form(rows.map(r => r.r))}</div></div>
    <dl class="kv"><div><dt>${isCur ? '현재 티어' : '마지막 티어'}</dt><dd>${esc(rows[0].div || '-')}</dd></div><div><dt>받은 첫 경기 티어</dt><dd>${esc(first.div || '-')}</dd></div>
      <div><dt>득실 (받은 경기)</dt><dd class="num">${gf} : ${ga}</dd></div></dl>
    ${list}
    <section><h2>내 골 종류</h2><div class="gt"><span class="h">종류</span><span class="h n">골</span><span class="h n">비율</span>
      ${(() => { const all = Object.values(k.kinds).reduce((a, b) => a + b, 0), pc = (v, t) => t ? Math.round(v / t * 100) : 0;
        return Object.entries(k.kinds).sort((a, b) => b[1] - a[1]).map(([n, c]) => `<span>${n}</span><span class="n num">${c}</span><span class="n num">${pc(c, all)}%</span>`).join('')
        + (k.known ? `<span class="sub">중거리 골 (18m 이상)</span><span class="n num">${k.out}</span><span class="n num">${pc(k.out, k.known)}%</span>` : '')
        + `<span class="sub">도움 없는 골</span><span class="n num">${k.solo}</span><span class="n num">${pc(k.solo, all)}%</span>`; })()}</div></section>
    <section><h2>최다 득점 선수</h2><ol class="scorers" style="display:block">${Object.entries(sc).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([n, c]) => `<li><span>${esc(n)}</span><span class="num">${c}골</span></li>`).join('')}</ol></section>
    <section><h2>경기 기록 (최신순)</h2>${show.map(r => {
      const goals = [...r.mg.map(g => ({ ...g, who: o.nick })), ...r.og2.map(g => ({ ...g, who: r.op }))].sort((x, y) => x.m - y.m);
      const tags = `${r.pk[0] || r.pk[1] ? `<span class="tag">승부차기 ${r.pk[0]} : ${r.pk[1]}</span>` : ''}${r.e === 1 ? '<span class="tag">몰수승</span>' : r.e === 2 ? '<span class="tag">몰수패</span>' : ''}`;
      return `<details class="mt off"><summary>${chip(r.r)}<span class="num">${r.g ?? '-'} : ${r.og ?? '-'}</span><span class="op">${esc(r.op)}${tags}</span><time>${mdate(r.d)}</time></summary>
        ${goalSides(goals, o.nick, r.op, r.g, r.og)}</details>`;
    }).join('')}</section>
    ${rows.length > show.length ? `<button class="btn watchbtn" data-more>${rows.length - show.length}경기 더 보기</button>` : ''}
    <p class="note">넥슨이 주는 공식경기 기록은 최근 약 30일이라, 받은 경기는 지우지 않고 시즌별로 계속 쌓음. 시즌이 바뀌면 지난 시즌은 위 시즌 목록에서 따로 볼 수 있음. 월드클래스 리그 같은 리그 경기는 공식경기 전적에 들어가지 않아 따로 묶음.${O.pending ? ` 아직 받는 중인 경기 ${O.pending}건은 다음 갱신 때 더해짐.` : ''}</p>`;
}

// ---------- 오늘의 등락 : 네 구단 선수 전체에서 1일 등락이 큰 선수 ----------
function movers() {
  const seen = {};
  orderOf().forEach(o => o.players.forEach(p => { if (p.now >= 1e7 && p.hist.length) (seen[key(p)] ??= { p, who: [] }).who.push(o); }));
  const list = Object.values(seen).map(x => ({ ...x, r: x.p.now / ago(x.p, 1) - 1 })).filter(x => Math.abs(x.r) >= .0005);
  const row = ({ p, who }) => { const [pc, amt] = move(p.now, ago(p, 1));
    return `<li><a class="mv" href="#/p/${p.spid}/${p.grade}/o${who[0].i}"><span class="p-id">${ident(p)}</span><small>${who.map(o => esc(o.nick)).join(', ')}</small>
      <span class="mv-r"><span class="num">${compact(p.now)}</span><span>${pc} ${amt}</span></span></a></li>`; };
  const up = list.filter(x => x.r > 0).sort((a, b) => b.r - a.r).slice(0, 3), down = list.filter(x => x.r < 0).sort((a, b) => a.r - b.r).slice(0, 3);
  if (!up.length && !down.length) return '';
  return `<div class="mv-pair">${[['오늘 많이 오른 선수', up], ['오늘 많이 내린 선수', down]].map(([h, l]) => `<section class="movers"><h2>${h}</h2>
    ${l.length ? `<ol>${l.map(row).join('')}</ol>` : '<p class="note">해당 선수 없음</p>'}</section>`).join('')}</div>
    <p class="note">네 구단 명단에서 시세 1,000만 BP 이상인 선수의 어제 대비 등락</p>`;
}

const notFound = what => `<div class="bar"><h1>${what}</h1></div><a class="btn" href="#/">구단 목록으로</a>`;

// ---------- 그리기 ----------
let after = null;
const rolled = {};
function render() {
  if (!S) return;
  const [, view, a, b, c] = location.hash.split('/');
  after = null;
  if (view === 'watch') { ui.q = a ? decodeURIComponent(a) : ''; if (ui.q) loadNames(); }
  $('#app').innerHTML = view === 'o' ? (b === 'off' ? viewOfficial(+a, c) : viewOwner(+a)) : view === 'p' ? viewPlayer(+a, +b, c) : view === 'watch' ? viewWatch() : view === 'h2h' ? viewH2H(a, b) : viewHome();
  document.querySelectorAll('[data-nav]').forEach(n => n.toggleAttribute('aria-current', n.dataset.nav === (['watch', 'h2h'].includes(view) ? view : 'home')));
  document.title = view === 'o' && S.owners[+a] ? `${S.owners[+a].nick} : 구단 시세판` : view === 'h2h' ? '상대전적 : 구단 시세판' : '구단 시세판';
  after?.();
  document.querySelectorAll('[data-roll]').forEach(el => {  // 값이 바뀐 숫자만 넘어오며 바뀜
    const k = location.hash + el.dataset.roll, v = el.textContent;
    if (rolled[k] != null && rolled[k] !== v) el.classList.add('roll');
    rolled[k] = v;
  });
  stamp();
}
function stamp() {
  if (!S) return;
  const min = Math.max(0, Math.round((Date.now() / 1000 - S.updated) / 60)), el = $('#stamp');
  const asked = ui.pinged && ui.pinged > S.updated && Date.now() / 1000 - ui.pinged < 300;
  el.textContent = asked ? '갱신 요청함, 1~2분 뒤 반영' : min < 1 ? '방금 갱신' : min < 60 ? `${min}분 전 갱신` : `${Math.floor(min / 60)}시간 전 갱신`;
  el.classList.toggle('late', !asked && min * 60 > STALE);
  el.title = clock(S.updated) + ' 기준';
}
async function load() {
  try {
    const r = await fetch('data.json?t=' + Date.now());
    if (!r.ok) throw 0;
    const fresh = await r.json(), changed = !S || fresh.updated !== S.updated;
    if (S && fresh.v && S.v && fresh.v !== S.v && LS.get('reloaded', '') !== fresh.v) { LS.set('reloaded', fresh.v); return location.reload(); }
    S = fresh;
    const now = Date.now() / 1000;
    if (now - S.updated > STALE && LS.get('token', '') && now - LS.get('pinged', 0) > 600) {
      LS.set('pinged', now);
      repoWrite('ping.json', () => ({ t: Math.round(now) }), '갱신 요청').then(() => { ui.pinged = now; stamp(); [45, 75, 105, 150].forEach(sec => setTimeout(load, sec * 1000)); }).catch(() => {});
    }
    if (changed && !['INPUT', 'SELECT'].includes(document.activeElement?.tagName)) render(); else stamp();
  } catch {
    if (!S) $('#app').innerHTML = '<div class="bar"><h1>시세를 불러오지 못함</h1></div><p class="note">인터넷 연결을 확인한 뒤 다시 시도하면 됨</p><button class="btn" data-reload>다시 시도</button>';
  }
}
async function loadNames() {
  if (NAMES || namesLoading || namesFailed) return;
  namesLoading = true;
  try { NAMES = await (await fetch('names.json')).json(); } catch { namesFailed = true; ui.msg = '선수 목록을 불러오지 못함. 잠시 뒤 다시 찾아보면 됨'; }
  namesLoading = false; render();
}

// ---------- 동작 ----------
document.addEventListener('change', e => { if (e.target.id === 'who') { LS.set('who', e.target.value); ui.msg = ''; render(); } });
document.addEventListener('click', e => {
  const link = e.target.closest('[data-setwho]'); if (link) LS.set('who', link.dataset.setwho);
  const b = e.target.closest('button, [role=tab]'); if (!b) return;
  const d = b.dataset;
  if ('edit' in d) { ui.edit = !ui.edit; render(); }
  else if (d.move) { const names = orderOf().map(o => o.nick), i = names.indexOf(d.nick), j = i + +d.move; [names[i], names[j]] = [names[j], names[i]]; LS.set('order', names); render();
    document.querySelector(`[data-nick="${CSS.escape(d.nick)}"][data-move="${d.move}"]:not([disabled])`)?.focus(); }
  else if (d.sort) { ui.sort = d.sort; render(); }
  else if (d.range) { const id = b.closest('[data-chart]').dataset.chart; ui.range[id] = d.range;
    b.parentNode.querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', x === b)); drawChart(id, charts[id]); }
  else if ('more' in d) { ui.more = true; render(); }
  else if ('back' in d) { history.length > 1 ? history.back() : location.hash = '#/'; }
  else if ('reload' in d) load();
  else if (d.add) { const p = search(ui.q)[d.add], grade = +$('#g' + d.add).value; saveWatch(who(), withEntry({ ...p, grade }), { ...p, grade }); }
  else if ('forget' in d) { LS.set('token', ''); ui.msg = '이 기기의 편집 권한을 지움'; render(); }
  else if (d.toggle) { const [spid, grade] = d.toggle.split('_').map(Number), entry = { spid, grade, name: d.name, season: d.season, seasonImg: d.img };
    const nick = d.who || who(); watchOf(nick).some(w => key(w) === d.toggle) ? saveWatch(nick, without(d.toggle)) : saveWatch(nick, withEntry(entry), entry); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if ('find' in e.target.dataset) { const q = $('#q').value.trim(); $('#q').blur(); location.hash = '#/watch' + (q ? '/' + encodeURIComponent(q) : ''); }
  if ('token' in e.target.dataset) { LS.set('token', $('#tok').value.trim()); ui.msg = $('#tok').value.trim() ? '토큰을 이 기기에 넣어 둠. 이제 친구들과 쓸 비밀번호를 정하면 됨' : ''; ui.needToken = true; render(); }
  if ('unlock' in e.target.dataset) unlock($('#pass').value);
  if ('setlock' in e.target.dataset) setLock($('#newpass').value);
});
// 차트 : 마우스를 올리거나 손가락으로 훑으면 그 시점의 값, 방향키로도 이동
for (const type of ['pointermove', 'pointerdown']) document.addEventListener(type, e => { const plot = e.target.closest?.('.plot'); if (plot?._pts) hoverChart(plot, nearest(plot, e.clientX)); });
document.addEventListener('pointerout', e => { const plot = e.target.closest?.('.plot'); if (plot && e.pointerType === 'mouse' && !plot.contains(e.relatedTarget)) hoverChart(plot, null); });
document.addEventListener('keydown', e => { const plot = e.target.closest?.('.plot'); if (!plot?._pts) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); hoverChart(plot, plot._i + (e.key === 'ArrowLeft' ? -1 : 1)); }
  if (e.key === 'Escape') hoverChart(plot, null); });
document.addEventListener('error', e => { const img = e.target;  // 선수 사진 : 동작 사진이 없으면 얼굴 사진, 그것도 없으면 빈 칸
  if (!img.classList?.contains('face')) return;
  if (!img.dataset.fb) { img.dataset.fb = 1; img.src = `${CDN}players/p${img.dataset.pid}.png`; } else img.style.visibility = 'hidden'; }, true);
addEventListener('hashchange', () => { ui.msg = ''; ui.edit = false; ui.more = false; ui.needToken = false; namesFailed = false; render(); scrollTo(0, 0); });
addEventListener('resize', () => Object.entries(charts).forEach(([id, r]) => drawChart(id, r)));
document.addEventListener('visibilitychange', () => document.hidden || load());
setInterval(load, 60000);
load();
</script>
</body>
</html>
